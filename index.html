<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>더 문 · 과학 윤리 수행평가</title><link rel="stylesheet" href="style.css"><body><header><strong>더 문 · 과학 윤리</strong><span id="progress"></span><button id="editSubmitted" hidden>제출 답안 수정</button><button id="save">임시저장</button><button id="expand">입력칸 크게 쓰기</button><button id="export">답안 내려받기</button><label>배율 <select id="zoom"><option value="fit">화면 맞춤</option><option value="720">읽기 편하게</option><option value="1086">원본 크기</option></select></label><span id="status" role="status"></span></header><p class="notice">현재 로컬 저장 / 제출 시뮬레이션입니다. 교사 또는 Google Sheets로 전송되지 않습니다. 같은 기기·브라우저에서 임시저장되며, 답안 파일도 내려받아 보관하세요. 입력칸을 두 번 누르면 크게 편집할 수 있습니다.</p><main id="viewport"><form id="sheet" novalidate></form></main><nav><button id="prev">이전</button><span id="counter" aria-live="polite"></span><button id="next">다음</button></nav><dialog id="editor"><form method="dialog"><h2 id="editorTitle"></h2><textarea id="bigText"></textarea><button value="cancel">취소</button><button id="apply" value="default">적용</button></form></dialog><dialog id="confirm"><h2>최종 제출 확인</h2><p>답안을 이 브라우저에 제출본으로 저장합니다. 외부 전송은 이루어지지 않습니다.</p><p id="summary"></p><button id="cancel">계속 작성</button><button id="submit">로컬 제출본 저장</button></dialog><section id="done" hidden><h1>로컬 제출본 저장 완료</h1><p>제출 시뮬레이션이 완료되었습니다. 교사·Google Sheets로 전송되지 않았습니다.</p><p id="stamp"></p><p>제출 후에도 언제든 답안을 수정하고 다시 제출할 수 있습니다.</p><button id="edit">제출 답안 수정</button><button id="downloadDone">답안 내려받기</button></section><script src="config.js"></script><script src="app.js"></script></body></html>
